name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Installation de Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Installation des dépendances
      run: npm ci

    - name: Tests unitaires
      run: npx ng test --watch=false

  build:
    needs: test
    # L'image n'est publiée qu'après un push sur main, jamais pour une pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract package name and version
      id: package-info
      run: echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push the Docker image
      run: |
        docker build --build-arg BUILD_ENV=production -t jeremygaydev/locmns-front .
        docker push jeremygaydev/locmns-front

    - name: Tag and push the Docker image
      run: |
        docker tag jeremygaydev/locmns-front jeremygaydev/locmns-front:${{ env.VERSION }}
        docker push jeremygaydev/locmns-front:${{ env.VERSION }}
