
<div class="page-wrapper">
  <div class="title-group">
    <h2>Tableau de bord</h2>
  </div>
  <div class="stats-grid">
    @for (card of listStatsCard(); track card.nomLabel) {
        <app-stat-card [route]="card.route" [nomLabel]="card.nomLabel"
                       [cptValeur]="card.cptValeur"
                       [btnLabel] = "card.btnLabel"/>
    }
    </div>
      <app-table
        [showAction]="false"
        [titre]="titre"
        [colonnes]="colonnesEmpruntsRecent"
        [data]="empruntService.listeEmpruntRecent()"
      />
  <div class="quick-actions">
    <h2 class="section-title">Actions rapides</h2>
    <div class="actions-row">
      <button class="action-btn action-btn--primary" routerLink="/enregistrer/emprunt">+ Enregistrer un emprunt</button>
      <button class="action-btn action-btn--primary" routerLink="/materiel/liste">Voir le matériel</button>
      <button class="action-btn action-btn--primary">Gérer les utilisateurs</button>
    </div>
  </div>
</div>
