<div class="page-wrapper">
  <div class="title-group">
    <h2>Demandes en cours</h2>
  </div>
    <app-table
      [colonnes]="colonnesDemande"
      [data]="empruntService.listeDemandeEmprunt()"
      [tableActions]="statutEmpruntService.listeStatutEmpruntDecision()"
      (decisionChange)="onDecisionChange($event)"
    />
  <hr class="form-divider">
  @if (erreurs()['erreur']) {
    <p class="field-error field-error--global">{{ erreurs()['erreur'] }}</p>
  }
  @if (succes()) {
    <p class="field-succes">✓ Action validée avec succès</p>
  }
  <div class="quick-actions">
    <h2 class="section-title">Actions rapides</h2>
    <div class="actions-row">
      <button class="action-btn action-btn--primary" routerLink="/enregistrer/emprunt">+ Enregistrer un emprunt</button>
      <button class="action-btn action-btn--primary" routerLink="/emprunt/liste">Voir les emprunts</button>
      <button class="action-btn action-btn--primary">Gérer les utilisateurs</button>
    </div>
  </div>
</div>
