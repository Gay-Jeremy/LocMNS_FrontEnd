
<div class="dashboard-wrapper">
  <div class="title-group">
    <h2>Liste des Emprunts</h2>
    <span class="subtitle">{{ dateJour }}</span>
  </div>
      <app-table
        [colonnes]="colonnesEmpruntsRecent"
        [data]="empruntService.listeEmpruntActif()"
      />
  <div class="quick-actions">
    <h2 class="section-title">Actions rapides</h2>
    <div class="actions-row">
      <button class="action-btn action-btn--primary">+ Enregistrer un emprunt</button>
      <button class="action-btn action-btn--primary">Voir le matériel</button>
      <button class="action-btn action-btn--primary">Gérer les utilisateurs</button>
    </div>
  </div>
</div>
