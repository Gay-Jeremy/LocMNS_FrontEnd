<div class="page-wrapper">
  <div class="title-group">
    @if(authService.isAdmin()){
      <h2>Liste du Materiel</h2>
    } @else {
      <h2>Liste du Materiel Emprunté </h2>
    }
  </div>
  <app-table
    [colonnes]="colonnesMateriel"
    [showEditDelete]="authService.isAdmin()"
    (delete)="onDelete($event)"
    (edit)="onEdit($event)"
    [actionPlaceholder]="authService.isAdmin() ? '— Changer le statut —' : '— Signaler un incident —'"
    [data]="materielService.listeMateriel()"
    [tableActions]="listeStatut()"
    (decisionChange)="onDecisionChange($event)"
  />
  <div class="quick-actions">
    <h2 class="section-title">Actions rapides</h2>
    <div class="actions-row">
      <button class="action-btn action-btn--primary" routerLink="/enregistrer/emprunt">+ Enregistrer un emprunt</button>
      <button class="action-btn action-btn--primary" routerLink="/emprunt/liste">Voir les emprunts</button>
      <button class="action-btn action-btn--primary">Gérer les utilisateurs</button>
    </div>
  </div>
</div>
