
<div class="page-wrapper">
  <div class="title-group">
    <h2>{{ titre() }}</h2>
  </div>
  <app-table
    [showAction]="false"
    [showEditDelete]="true"
    [showNote]="true"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    [colonnes]="colonnesEmpruntsRecent"
    [data]="data()"
  />
  @if (empruntASupprimer()) {
    <div class="modale-overlay">
      <div class="modale">
        <p>Confirmez-vous la suppression de l'emprunt n°{{ empruntASupprimer().id }} ?</p>
        <div class="modale-actions">
          <button class="btn-annuler" (click)="annulerSuppression()">Annuler</button>
          <button class="btn-supprimer" (click)="confirmerSuppression()">Confirmer</button>
        </div>
      </div>
    </div>
  }
  <div class="quick-actions">
    <h2 class="section-title">Actions rapides</h2>
    <div class="actions-row">
      <button class="action-btn action-btn--primary" routerLink="/enregistrer/emprunt">+ Enregistrer un emprunt</button>
      <button class="action-btn action-btn--primary" routerLink="/materiel/liste">Voir le matériel</button>
      <button class="action-btn action-btn--primary">Gérer les utilisateurs</button>
    </div>
  </div>
</div>
