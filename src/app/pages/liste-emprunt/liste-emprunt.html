
<div class="page-wrapper">
  <div class="title-group">
    <h2>{{ titre() }}</h2>
  </div>
  <app-table
    [showAction]="true"
    [actionPlaceholder]="authService.isAdmin() ? '— Changer le statut —' : '— Faire une demande—'"
    [tableActions]="listeStatut()"
    (decisionChange)="onDecisionChange($event)"
    [showEditDelete]="authService.isAdmin()"
    [showNote]="true"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    [colonnes]="colonnesEmpruntsRecent"
    [data]="data()"
  />
  @if (showDateModal()) {
    <app-date-picker
      [dateFin]="pendingEvent()?.dateFin ?? ''"
      [code]="pendingEvent()?.code ?? ''"
      (dateSelect)="onDateConfirmed($event)"
      (cancel)="onDateCancelled()"
    />
  }
  <div class="quick-actions">
    <h2 class="section-title">Actions rapides</h2>
    <div class="actions-row">
      <button class="action-btn action-btn--primary" routerLink="/enregistrer/emprunt">+ Enregistrer un emprunt</button>
      <button class="action-btn action-btn--primary" routerLink="/materiel/liste">Voir le matériel</button>
      <button class="action-btn action-btn--primary">Gérer les utilisateurs</button>
    </div>
  </div>
</div>
